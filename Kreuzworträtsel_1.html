<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kreuzworträtsel 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #EEF2F1;
    --paper: #FFFFFF;
    --ink: #1D2B33;
    --muted: #55666E;
    --line: #B9C7C5;
    --accent: #2A7768;
    --accent-ink: #FFFFFF;
    --key: #F4D35E;
    --key-ink: #1D2B33;
    --row: #E1EFEC;
    --ok: #CFE9D9;
    --bad: #F7D5D0;
    --bad-line: #B3382C;
    --help: #E3E0F3;
    --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-head: "Young Serif", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141C20; --paper: #1D282D; --ink: #E8EFEE; --muted: #9DB0B5; --line: #3F5157;
      --accent: #5FBFAE; --accent-ink: #10201D; --key: #D9B93F; --key-ink: #1A1A12;
      --row: #24373A; --ok: #22483A; --bad: #55302B; --bad-line: #F08A7E; --help: #34304F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141C20; --paper: #1D282D; --ink: #E8EFEE; --muted: #9DB0B5; --line: #3F5157;
    --accent: #5FBFAE; --accent-ink: #10201D; --key: #D9B93F; --key-ink: #1A1A12;
    --row: #24373A; --ok: #22483A; --bad: #55302B; --bad-line: #F08A7E; --help: #34304F;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.5;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 {
    font-family: var(--font-head);
    font-weight: 400;
    font-size: clamp(1.9rem, 5vw, 2.8rem);
    line-height: 1.1;
    margin: 0 0 8px;
  }
  .intro { margin: 0 0 24px; color: var(--muted); max-width: 60ch; }

  .layout { display: grid; gap: 28px; }
  @media (min-width: 900px) {
    .layout { grid-template-columns: auto 1fr; align-items: start; gap: 40px; }
  }

  /* Board */
  .board-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    --num: 26px;
    --gap: 3px;
    --cell: min(44px, calc((100vw - 32px - 32px - var(--num) - 11 * var(--gap)) / 11));
  }
  .board {
    display: grid;
    grid-template-columns: var(--num) repeat(11, var(--cell));
    grid-auto-rows: var(--cell);
    gap: var(--gap);
    align-items: center;
  }
  .rownum {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: right;
    padding-right: 6px;
    font-variant-numeric: tabular-nums;
  }
  .cell {
    width: 100%; height: 100%;
    border: 1.5px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    text-align: center;
    text-transform: uppercase;
    font: 700 clamp(0.95rem, 4vw, 1.35rem)/1 var(--font-body);
    padding: 0;
    caret-color: transparent;
    cursor: pointer;
    transition: background-color .15s, border-color .15s;
  }
  .cell.key { background: var(--key); color: var(--key-ink); border-color: transparent; }
  .cell.row-active:not(.key) { background: var(--row); }
  .cell:focus { outline: 3px solid var(--accent); outline-offset: 1px; position: relative; z-index: 1; }
  .cell.ok:not(.key) { background: var(--ok); border-color: var(--accent); }
  .cell.ok.key { border: 2px solid var(--accent); }
  .cell.bad { background: var(--bad); border: 2px dashed var(--bad-line); }
  .cell.help:not(.key) { background: var(--help); }
  .cell.help { font-style: italic; }
  .spacer { visibility: hidden; }

  /* Solution word */
  .solution { margin-top: 20px; }
  .solution p { margin: 0 0 8px; font-weight: 700; }
  .letters { display: flex; gap: 4px; flex-wrap: wrap; }
  .letter {
    width: 36px; height: 44px;
    display: grid; place-items: center;
    background: var(--key); color: var(--key-ink);
    border-radius: 4px;
    font-weight: 700; font-size: 1.3rem;
  }
  .letter:empty { background: transparent; border: 2px dashed var(--line); }
  .won .letter { animation: hop .5s ease both; }
  .won .letter:nth-child(2) { animation-delay: .05s; }
  .won .letter:nth-child(3) { animation-delay: .1s; }
  .won .letter:nth-child(4) { animation-delay: .15s; }
  .won .letter:nth-child(5) { animation-delay: .2s; }
  .won .letter:nth-child(6) { animation-delay: .25s; }
  .won .letter:nth-child(7) { animation-delay: .3s; }
  .won .letter:nth-child(8) { animation-delay: .35s; }
  @keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .won .letter { animation: none; } .cell { transition: none; } }

  /* Buttons */
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  button.btn {
    font: 700 1rem var(--font-body);
    padding: 10px 16px;
    min-height: 44px;
    border-radius: 8px;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
  }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); }
  button.btn:hover { filter: brightness(1.08); }
  button.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .status { min-height: 1.6em; margin: 14px 0 0; font-weight: 700; }
  .status.good { color: var(--accent); }

  /* Clues */
  .clues h2 { font-family: var(--font-head); font-weight: 400; font-size: 1.5rem; margin: 0 0 12px; }
  .clues ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .clues li { margin: 0; }
  .clue {
    width: 100%;
    display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: start;
    text-align: left;
    font: inherit; color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .clue:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .clue.active { background: var(--row); border-color: var(--accent); }
  .clue .n { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .clue .len { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
  .clue.done .t::after { content: " ✓ richtig"; color: var(--accent); font-weight: 700; }
  .note { margin-top: 20px; color: var(--muted); font-size: 0.95rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kreuzworträtsel 1</h1>
  <p class="intro">Schreibe jedes Wort in eine Reihe. Die gelben Kästchen ergeben von oben nach unten das Lösungswort: eine Stadt in Österreich.</p>

  <div class="layout">
    <section aria-label="Rätsel">
      <div class="board-card">
        <div class="board" id="board" role="group" aria-label="Kreuzworträtsel-Gitter"></div>

        <div class="solution" id="solution">
          <p>Lösungswort</p>
          <div class="letters" id="letters" aria-live="polite"></div>
        </div>

        <div class="actions">
          <button class="btn primary" id="check" type="button">Prüfen</button>
          <button class="btn" id="hint" type="button">Buchstabe zeigen</button>
          <button class="btn" id="reveal" type="button">Lösung zeigen</button>
          <button class="btn" id="reset" type="button">Von vorn beginnen</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section class="clues" aria-label="Hinweise">
      <h2>Hinweise</h2>
      <ol id="clues"></ol>
      <p class="note">Tipp: Mit den Pfeiltasten kannst du dich im Gitter bewegen. Die Buchstaben Ä, Ö, Ü und ß brauchst du nicht.</p>
    </section>
  </div>
</div>

<script>
(function () {
  var SOLUTION = "SALZBURG";
  // keyIdx = Position des gelben Buchstabens im Wort (ab 0)
  var WORDS = [
    { a: "GESCHENK",   k: 2, clue: "Du bekommst es zum Geburtstag oder zu Weihnachten. Man packt es aus." },
    { a: "NACHBAR",    k: 1, clue: "Diese Person wohnt in der Wohnung neben dir." },
    { a: "BALKON",     k: 2, clue: "Viele Wohnungen haben ihn. Im Sommer sitzt man dort draußen." },
    { a: "KREUZUNG",   k: 4, clue: "Hier treffen sich zwei Straßen. Man muss auf den Verkehr achten." },
    { a: "URLAUB",     k: 5, clue: "Du arbeitest nicht und fährst zum Beispiel ans Meer." },
    { a: "FREUNDIN",   k: 3, clue: "Mit dieser Person verstehst du dich sehr gut, und sie ist weiblich." },
    { a: "GEBURTSTAG", k: 4, clue: "Einmal im Jahr feierst du diesen Tag." },
    { a: "REGEN",      k: 2, clue: "Es kommt vom Himmel, und du brauchst einen Schirm." }
  ];

  // Prüfen, ob die gelbe Spalte das Lösungswort ergibt
  WORDS.forEach(function (w, i) {
    if (w.a.charAt(w.k) !== SOLUTION.charAt(i)) throw new Error("Falsches Lösungswort in Reihe " + (i + 1));
  });

  var KEYCOL = Math.max.apply(null, WORDS.map(function (w) { return w.k; }));
  WORDS.forEach(function (w) { w.start = KEYCOL - w.k; });

  var boardEl = document.getElementById("board");
  var cluesEl = document.getElementById("clues");
  var lettersEl = document.getElementById("letters");
  var solutionEl = document.getElementById("solution");
  var statusEl = document.getElementById("status");

  var inputs = [];   // inputs[r][i]
  var clueBtns = [];
  var activeRow = -1;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // Gitter aufbauen
  WORDS.forEach(function (w, r) {
    boardEl.appendChild(el("div", "rownum", String(r + 1)));
    inputs[r] = [];
    for (var c = 0; c < 11; c++) {
      var i = c - w.start;
      if (i < 0 || i >= w.a.length) {
        boardEl.appendChild(el("div", "spacer"));
        continue;
      }
      var inp = document.createElement("input");
      inp.type = "text";
      inp.maxLength = 2;
      inp.className = "cell" + (i === w.k ? " key" : "");
      inp.autocomplete = "off";
      inp.autocapitalize = "characters";
      inp.spellcheck = false;
      inp.setAttribute("aria-label", "Reihe " + (r + 1) + ", Buchstabe " + (i + 1) + " von " + w.a.length + (i === w.k ? ", Lösungswort" : ""));
      inp.dataset.r = r; inp.dataset.i = i;
      bind(inp, r, i);
      inputs[r][i] = inp;
      boardEl.appendChild(inp);
    }
  });

  // Hinweise aufbauen
  WORDS.forEach(function (w, r) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.className = "clue";
    b.appendChild(el("span", "n", (r + 1) + "."));
    b.appendChild(el("span", "t", w.clue));
    b.appendChild(el("span", "len", w.a.length + " Buchst."));
    b.addEventListener("click", function () { focusRowStart(r); });
    li.appendChild(b);
    cluesEl.appendChild(li);
    clueBtns[r] = b;
  });

  // Lösungswort-Kästchen
  for (var s = 0; s < SOLUTION.length; s++) lettersEl.appendChild(el("div", "letter"));

  function focusCell(r, i) {
    if (r < 0 || r >= WORDS.length) return;
    if (i < 0 || i >= WORDS[r].a.length) return;
    inputs[r][i].focus();
    inputs[r][i].select();
  }
  function focusRowStart(r) {
    var i = 0;
    for (var j = 0; j < WORDS[r].a.length; j++) {
      if (!inputs[r][j].value) { i = j; break; }
    }
    focusCell(r, i);
  }
  function moveVertical(r, i, dir) {
    var col = WORDS[r].start + i;
    var nr = r + dir;
    if (nr < 0 || nr >= WORDS.length) return;
    var ni = col - WORDS[nr].start;
    ni = Math.max(0, Math.min(WORDS[nr].a.length - 1, ni));
    focusCell(nr, ni);
  }

  function clearState(inp) { inp.classList.remove("ok", "bad", "help"); }

  function setLetter(r, i, ch) {
    inputs[r][i].value = ch;
    clearState(inputs[r][i]);
  }

  function bind(inp, r, i) {
    inp.addEventListener("focus", function () { setActive(r); inp.select(); });
    inp.addEventListener("click", function () { inp.select(); });
    inp.addEventListener("keydown", function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var k = e.key;
      if (k === "ArrowLeft")  { e.preventDefault(); focusCell(r, i - 1); }
      else if (k === "ArrowRight") { e.preventDefault(); focusCell(r, i + 1); }
      else if (k === "ArrowUp")    { e.preventDefault(); moveVertical(r, i, -1); }
      else if (k === "ArrowDown")  { e.preventDefault(); moveVertical(r, i, 1); }
      else if (k === "Backspace") {
        e.preventDefault();
        if (inp.value) { setLetter(r, i, ""); }
        else if (i > 0) { setLetter(r, i - 1, ""); focusCell(r, i - 1); }
        update();
      }
      else if (k === "Delete") { e.preventDefault(); setLetter(r, i, ""); update(); }
      else if (/^[a-zA-Z]$/.test(k)) {
        e.preventDefault();
        setLetter(r, i, k.toUpperCase());
        update();
        focusCell(r, i + 1);
      }
      else if (k.length === 1) { e.preventDefault(); }
    });
    // Für Handy-Tastaturen
    inp.addEventListener("input", function () {
      var v = inp.value.toUpperCase().replace(/[^A-Z]/g, "");
      var ch = v.slice(-1);
      setLetter(r, i, ch);
      update();
      if (ch) focusCell(r, i + 1);
    });
  }

  function setActive(r) {
    activeRow = r;
    inputs.forEach(function (row, rr) {
      row.forEach(function (c) { c.classList.toggle("row-active", rr === r); });
      clueBtns[rr].classList.toggle("active", rr === r);
    });
  }

  function rowCorrect(r) {
    return WORDS[r].a.split("").every(function (ch, i) { return inputs[r][i].value === ch; });
  }

  function update() {
    // Lösungswort-Anzeige
    var boxes = lettersEl.children;
    for (var r = 0; r < WORDS.length; r++) {
      boxes[r].textContent = inputs[r][WORDS[r].k].value || "";
    }
    var allRight = WORDS.every(function (w, r) { return rowCorrect(r); });
    solutionEl.classList.toggle("won", allRight);
    if (allRight) {
      statusEl.className = "status good";
      statusEl.textContent = "Super! Alles ist richtig. Das Lösungswort ist SALZBURG.";
    } else if (statusEl.classList.contains("good")) {
      statusEl.className = "status";
      statusEl.textContent = "";
    }
    return allRight;
  }

  document.getElementById("check").addEventListener("click", function () {
    var right = 0, wrong = 0, empty = 0;
    WORDS.forEach(function (w, r) {
      w.a.split("").forEach(function (ch, i) {
        var inp = inputs[r][i];
        inp.classList.remove("ok", "bad");
        if (!inp.value) { empty++; return; }
        if (inp.value === ch) { inp.classList.add("ok"); right++; }
        else { inp.classList.add("bad"); wrong++; }
      });
      clueBtns[r].classList.toggle("done", rowCorrect(r));
    });
    if (update()) return;
    statusEl.className = "status";
    var parts = [];
    parts.push(right + (right === 1 ? " Buchstabe ist richtig" : " Buchstaben sind richtig"));
    if (wrong) parts.push(wrong + (wrong === 1 ? " ist falsch" : " sind falsch") + " (gestrichelt markiert)");
    if (empty) parts.push(empty + (empty === 1 ? " fehlt noch" : " fehlen noch"));
    statusEl.textContent = parts.join(", ") + ".";
  });

  document.getElementById("hint").addEventListener("click", function () {
    var target = null;
    var rows = [];
    if (activeRow >= 0) rows.push(activeRow);
    for (var r = 0; r < WORDS.length; r++) if (rows.indexOf(r) < 0) rows.push(r);
    outer:
    for (var n = 0; n < rows.length; n++) {
      var rr = rows[n];
      for (var i = 0; i < WORDS[rr].a.length; i++) {
        if (inputs[rr][i].value !== WORDS[rr].a.charAt(i)) { target = [rr, i]; break outer; }
      }
    }
    if (!target) { statusEl.className = "status"; statusEl.textContent = "Es gibt nichts mehr zu zeigen."; return; }
    var t = inputs[target[0]][target[1]];
    t.value = WORDS[target[0]].a.charAt(target[1]);
    clearState(t);
    t.classList.add("help");
    update();
    focusCell(target[0], target[1]);
    statusEl.className = "status";
    statusEl.textContent = "Ein Buchstabe in Reihe " + (target[0] + 1) + " wurde gezeigt.";
  });

  document.getElementById("reveal").addEventListener("click", function () {
    WORDS.forEach(function (w, r) {
      w.a.split("").forEach(function (ch, i) {
        var inp = inputs[r][i];
        if (inp.value !== ch) { inp.value = ch; clearState(inp); inp.classList.add("help"); }
      });
    });
    update();
    statusEl.className = "status";
    statusEl.textContent = "Das ist die Lösung. Das Lösungswort ist SALZBURG.";
  });

  document.getElementById("reset").addEventListener("click", function () {
    inputs.forEach(function (row) { row.forEach(function (inp) { inp.value = ""; clearState(inp); }); });
    clueBtns.forEach(function (b) { b.classList.remove("done"); });
    statusEl.className = "status";
    statusEl.textContent = "";
    update();
    focusCell(0, 0);
  });

  update();
})();
</script>
</body>
</html>
